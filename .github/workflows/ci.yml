name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: make install PYTHON=python
      - name: Lint and format check
        run: make lint PYTHON=python
      - name: Audit Python dependencies
        run: make audit PYTHON=python
      - name: Run tests
        run: make test PYTHON=python
      - name: Run sample engine
        run: make run PYTHON=python
      - name: Run scale smoke test
        run: python scripts/benchmark_engine.py --rows 10000 --report-date 2026-06-19
      - name: Upload generated review evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-run-evidence
          path: outputs/
          if-no-files-found: error
          retention-days: 14
